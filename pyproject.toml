[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-dicom-pipeline"
version = "0.1.0"
description = "Study-agnostic, resumable MRI DICOM intake and NIfTI conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydicom>=3.0,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1,<2", "twine>=5,<7"]

[project.scripts]
mri-dicom-pipeline = "mri_dicom_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mri_dicom_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
