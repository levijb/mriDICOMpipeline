name: Tests and package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.15: production and local testing run Python 3.15.2 (round 4 spec D-12).
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      # Round 4 Hypothesis properties run with fixed seeds in CI (spec D-6).
      HYPOTHESIS_PROFILE: ci
    steps:
      # Full history: the R4-DST tests build from `git archive 4d8a362...` (R4-F-032, owner approval 2026-11-25).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,round4]"
      # Branch coverage is reported, with no failure threshold (round 4 spec D-6).
      - run: python -m coverage run --branch -m pytest
      - run: python -m coverage report

  real-converter:
    name: real-converter (${{ matrix.os }}, dcm2niix ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported dcm2niix releases (Q2). The target
        # cluster's module version is not known yet, so oldest = newest.
        include:
          - os: ubuntu-latest
            version: v1.0.20261029
            asset: dcm2niix_lnx.zip
            sha256: decc03fe9c08e696700876bd0e28fbc1dda5be11979905dfa5a5e01063cdf758
          - os: windows-latest
            version: v1.0.20261029
            asset: dcm2niix_win.zip
            sha256: 71ab03724075c2bf95841588a12efa64c89aff5cc52a36b04d40ac378e9c31fd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,round4]"
      - name: Download dcm2niix ${{ matrix.version }}
        shell: python
        run: |
          import hashlib, os, stat, subprocess, urllib.request, zipfile
          url = 'https://github.com/rordenlab/dcm2niix/releases/download/${{ matrix.version }}/${{ matrix.asset }}'
          temp = os.environ['RUNNER_TEMP']
          archive = os.path.join(temp, 'dcm2niix.zip')
          urllib.request.urlretrieve(url, archive)
          with open(archive, 'rb') as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          if digest != '${{ matrix.sha256 }}':
              raise SystemExit(f'dcm2niix archive checksum mismatch: {digest}')
          target = os.path.join(temp, 'dcm2niix')
          with zipfile.ZipFile(archive) as z:
              z.extractall(target)
          exe = os.path.join(target, 'dcm2niix.exe' if os.name == 'nt' else 'dcm2niix')
          os.chmod(exe, os.stat(exe).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          # Fail here rather than let the smoke tests skip silently.
          version = subprocess.run([exe, '-v'], capture_output=True, text=True).stdout
          if '${{ matrix.version }}' not in version:
              raise SystemExit(f'unexpected dcm2niix version output: {version!r}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MRI_PIPELINE_DCM2NIIX={exe}\n')
      - run: python -m pytest tests/test_real_converter.py -rs
      - run: python -m pytest tests/round4 -m r4real -rs

  bids:
    # select --bids output: the published synthetic dataset must pass the BIDS validator with
    # zero errors, and the pre-contrast filter file must work with pybids.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,round4]" "bids-validator-deno==3.0.2" "pybids==0.22.0"
      - name: Fail here rather than let the checks skip silently
        run: |
          bids-validator-deno --version
          python -c "import bids.layout"
      - run: python -m pytest tests/test_bids_export.py -rs
      - run: python -m pytest tests/round4 -m r4tool -rs

  round4-calibration:
    # Round 4 D-13: the header reader and the pixel sampler on the public dcm_qa vendor datasets.
    # Never gating: a GitHub archive whose bytes change, or a calibration difference, is reported here.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,round4]"
      - name: Fetch the vendor datasets at their pinned commits and verify their checksums
        shell: python
        run: |
          import hashlib, json, os, urllib.request, zipfile
          spec = json.load(open('tests/round4/expected/vendor_datasets.json', encoding='utf-8'))
          root = os.path.join(os.environ['RUNNER_TEMP'], 'vendor_datasets')
          for entry in spec['datasets']:
              name = entry['repo'].split('/')[1]
              url = f"https://codeload.github.com/{entry['repo']}/zip/{entry['commit']}"
              folder = os.path.join(root, name)
              os.makedirs(os.path.join(folder, 'archive'), exist_ok=True)
              archive = os.path.join(folder, 'archive', f"{name}-{entry['commit']}.zip")
              urllib.request.urlretrieve(url, archive)
              with open(archive, 'rb') as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              if digest != entry['archive_sha256']:
                  raise SystemExit(f"{name}: archive checksum mismatch: {digest}")
              # The data is only read by the tests; nothing in it is executed.
              with zipfile.ZipFile(archive) as z:
                  z.extractall(os.path.join(folder, 'extracted'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'R4_VENDOR_DIR={root}\n')
      - run: python -m pytest tests/round4/test_r4_oracles.py -m r4calib -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/check_distribution.py
      - run: python -m pip install dist/*.whl
      - run: mri-dicom-pipeline --help
      - run: python -m mri_dicom_pipeline prepare --help
      # Round 4 R-PRV-4: dependency vulnerability scan, pinned to the version recorded at Gate G0;
      # reported, never gating.
      - name: pip-audit
        continue-on-error: true
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --format json --output pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
